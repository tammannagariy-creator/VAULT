# Fly.io deployment configuration for Vault
app = "vault-storage-cluster"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "vault_data"
  destination = "/data"

[env]
  NODE_ENV = "production"
  REPLICATION_FACTOR = "3"
  WRITE_QUORUM = "2"
  READ_QUORUM = "2"
